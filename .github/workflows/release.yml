name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: DualLink
            nsis_suffix: -setup.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # Garde-fou : `cargo clippy -D warnings` doit passer avant toute
      # publication. Le crate ne compile que si `frontendDist` (../dist)
      # existe ; un placeholder suffit ici, le vrai front est construit
      # juste après par `beforeBuildCommand`.
      - name: Clippy (zéro avertissement)
        shell: bash
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || printf '<!doctype html><title>placeholder</title>' > dist/index.html
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          releaseId: ${{ github.event_name == 'workflow_dispatch' && '' || '' }}


      # Le nom du ZIP est dérivé du tag (v1.1.0 -> DualLink_1.1.0_x64-portable.zip).
      # Il était codé en dur sur 1.0.0: depuis la release v1.0.1, chaque version
      # publiée créait un ZIP portant le numéro de la version précédente.
      - name: Create Windows portable ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release
          7z a -tzip "../../../DualLink_${VERSION}_x64-portable.zip" duallink.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            DualLink_*-portable.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DualLink ${{ github.ref_name }}
          body: |
            ## DualLink ${{ github.ref_name }}

            ### Installation
            - **Windows** : Téléchargez `DualLink_*-x64-setup.exe` (NSIS), `*_x64_en-US.msi`, ou `*-portable.zip` (portable)

            > ⚠️ L'application nécessite les droits admin (UAC) pour gérer les cartes réseau.

            > Application Windows uniquement : elle s'appuie sur PowerShell, `ping.exe` et la table de routage Windows.

            Journal des versions : [CHANGELOG.md](https://github.com/Endymi0n74/DualLink/blob/master/CHANGELOG.md)
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
