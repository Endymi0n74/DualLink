name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: DualLink
            nsis_suffix: -setup.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: DualLink
            dmg_suffix: .dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: DualLink
            appimage_suffix: .AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          releaseId: ${{ github.event_name == 'workflow_dispatch' && '' || '' }}


      - name: Create Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/release
          7z a -tzip "../../../DualLink_1.0.0_x64-portable.zip" duallink.exe


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            DualLink_*-portable.zip
            DualLink_*-portable.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DualLink ${{ github.ref_name }}
          body: |
            ## DualLink ${{ github.ref_name }}

            ### Installation
            - **Windows** : Téléchargez `DualLink_*-x64-setup.exe` (NSIS), `*_x64_en-US.msi`, ou `*-portable.zip` (portable)
            - **macOS** : Téléchargez `DualLink_*.dmg` (Apple Silicon)
            - **Linux** : Téléchargez `DualLink_*.AppImage` (portable) ou `*.deb` (Debian/Ubuntu)

            > ⚠️ Windows : l'application nécessite les droits admin (UAC)
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.zip
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
